<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miranda Beitel — Engineering Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fafaf8; --ink:#151515; --muted:#6e6e6a; --line:#e4e3df; --tile:#f0efeb;
    --blue:#1d3566; --blue-2:#25427c; --accent:#2a4a8a;
    --sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  img{display:block;max-width:100%}
  .wrap{max-width:1120px;margin:0 auto;padding-left:32px;padding-right:32px}
  .label{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  h2.sec{font-size:clamp(28px,3.6vw,40px);font-weight:500;letter-spacing:-.03em;line-height:1.1}

  /* Nav / tabs */
  nav{position:sticky;top:0;z-index:20;background:var(--blue);color:#fff;border-bottom:1px solid rgba(255,255,255,.1)}
  nav .wrap{display:flex;justify-content:space-between;align-items:center;height:62px;gap:20px}
  nav .name{font-weight:600;text-decoration:none;font-size:15px;white-space:nowrap}
  nav .tabs{display:flex;gap:4px}
  nav .tabs a{font-size:14px;color:rgba(255,255,255,.72);text-decoration:none;padding:7px 14px;border-radius:999px;transition:background .15s,color .15s}
  nav .tabs a:hover{color:#fff;background:rgba(255,255,255,.08)}
  nav .tabs a.on{color:var(--blue);background:#fff}

  /* Views */
  .view{display:none}
  .view.on{display:block;animation:fade .45s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  /* Banner (photo hero with overlay) */
  .banner{position:relative;color:#fff;background:var(--blue);overflow:hidden}
  .banner .bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.38;filter:saturate(.85)}
  .banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(29,53,102,.35),rgba(29,53,102,.85))}
  .banner .wrap{position:relative;z-index:1;padding-top:110px;padding-bottom:84px}
  .banner .label{color:rgba(255,255,255,.7)}
  .banner h1{font-size:clamp(38px,6vw,68px);font-weight:500;letter-spacing:-.035em;line-height:1.04;margin-top:16px;max-width:16ch}
  .banner p{margin-top:18px;font-size:19px;color:rgba(255,255,255,.85);max-width:56ch}
  .banner.home .wrap{padding-top:150px;padding-bottom:120px}
  .banner.home h1 span{color:rgba(255,255,255,.62)}
  .banner.home .bg{background-position:center 35%;opacity:.45}

  /* Summary (round photo + bullets) */
  .summary{display:grid;grid-template-columns:300px 1fr;gap:72px;align-items:start;padding-top:96px}
  .summary .photo{width:300px;height:300px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 8px #fff,0 0 0 9px var(--line)}
  .summary .photo img{width:100%;height:100%;object-fit:cover}
  .summary h2{margin-bottom:28px}
  .qa{display:grid;grid-template-columns:1fr 1fr;gap:28px 48px}
  .qa h3{font-size:15px;font-weight:600;color:var(--blue);margin-bottom:8px}
  .qa ul{list-style:none}
  .qa li{font-size:15.5px;color:#3a3a37;padding:4px 0 4px 16px;position:relative}
  .qa li::before{content:"";position:absolute;left:0;top:14px;width:6px;height:1px;background:var(--muted)}

  /* Skills chips */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chips span{font-family:var(--mono);font-size:12.5px;padding:7px 13px;border-radius:999px;background:var(--blue);color:#fff}
  .chips.light span{background:transparent;border:1px solid var(--line);color:#444}

  /* Project cards */
  .filters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 36px}
  .filters button{font:500 12.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);background:#fff;color:#444;padding:8px 15px;border-radius:999px;cursor:pointer;transition:all .15s}
  .filters button:hover{border-color:var(--blue);color:var(--blue)}
  .filters button.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .card{display:block;text-decoration:none;border-radius:8px;overflow:hidden;background:#fff;border:1px solid var(--line);transition:transform .25s,box-shadow .25s}
  .card:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(29,53,102,.12)}
  .card .thumb{aspect-ratio:4/3;background:var(--tile);overflow:hidden;position:relative}
  .card .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
  .card .thumb.contain img{object-fit:contain;padding:22px;background:#fff}
  .card:hover .thumb img{transform:scale(1.04)}
  .card .cap{background:var(--blue);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .card .cap b{font-weight:500;font-size:16px}
  .card .cap span{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
  .tile-type{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;background:linear-gradient(135deg,#e8edf6,#f6f7fa);color:var(--blue)}
  .tile-type b{font-size:24px;font-weight:500;letter-spacing:-.02em}

  /* Project page */
  .meta{display:flex;flex-wrap:wrap;gap:32px;margin-top:30px}
  .meta div{font-size:14px;color:rgba(255,255,255,.85)}
  .meta div b{display:block;font-family:var(--mono);font-size:11px;font-weight:400;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:4px}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start;margin-top:84px}
  .split.rev > :first-child{order:2}
  .split h3{font-size:24px;font-weight:500;letter-spacing:-.02em;margin-bottom:16px}
  .split p{color:#2f2f2c;margin-bottom:14px;font-size:16.5px}
  .split ul{list-style:none;margin-top:6px}
  .split li{padding:11px 0;border-top:1px solid var(--line);font-size:16px;color:#2f2f2c}
  .split li:last-child{border-bottom:1px solid var(--line)}
  figure{background:var(--tile);border-radius:8px;overflow:hidden;position:relative;cursor:zoom-in}
  figure img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
  figure.contain{background:#fff;border:1px solid var(--line)}
  figure.contain img{object-fit:contain;padding:20px}
  figure:hover img{transform:scale(1.02)}
  figcaption{position:absolute;left:12px;bottom:10px;font-family:var(--mono);font-size:11px;color:#555;background:rgba(255,255,255,.92);padding:3px 8px;border-radius:3px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:84px}
  .stats.two{grid-template-columns:1fr 1fr}
  .stat{border-left:3px solid var(--blue);background:#fff;padding:22px 24px;border-radius:0 8px 8px 0}
  .stat b{display:block;font-size:36px;font-weight:500;letter-spacing:-.03em;line-height:1;color:var(--blue)}
  .stat span{display:block;margin-top:10px;font-size:14px;color:var(--muted);line-height:1.45}
  .comps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
  .comp{border:1px solid var(--line);border-radius:8px;padding:22px;background:#fff}
  .comp h4{font-size:16.5px;font-weight:500;margin:8px 0}
  .comp p{font-size:14.5px;color:#4a4a46;line-height:1.5;margin:0}
  .block{margin-top:84px}
  .block > .label{display:block;margin-bottom:18px}
  .skills-band{margin-top:96px;padding:44px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:center}
  .skills-band h3{font-size:20px;font-weight:500;letter-spacing:-.01em}
  .pager{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:40px;font-size:15px}
  .pager a{text-decoration:none;color:var(--accent)}
  .pager a:hover{text-decoration:underline}
  .pager .all{background:var(--blue);color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em}
  .pager .all:hover{text-decoration:none;background:var(--blue-2)}
  .others{margin-top:96px}
  .others h2{margin-bottom:28px}

  .section{padding-top:96px}
  .section-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:32px}
  .section-head a{font-size:14px;color:var(--accent);text-decoration:none}
  .lede{font-size:18px;color:#3a3a37;max-width:60ch;margin-top:12px}

  .r-sec{margin-top:72px}
  .r-h{font-size:13px;font-family:var(--mono);font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);padding-bottom:12px;border-bottom:2px solid var(--blue)}
  .r-row{display:grid;grid-template-columns:260px 1fr;gap:32px;padding:24px 0;border-bottom:1px solid var(--line)}
  .r-row h4{font-size:18px;font-weight:500;letter-spacing:-.01em}
  .r-sub{font-size:14px;color:var(--muted);margin-top:4px}
  .r-row ul{list-style:none}
  .r-row li{font-size:15.5px;color:#2f2f2c;padding:4px 0 4px 18px;position:relative}
  .r-row li::before{content:"";position:absolute;left:0;top:15px;width:8px;height:1px;background:var(--blue)}
  .brand-row{display:grid;grid-template-columns:240px 1fr;gap:40px;align-items:center;margin-top:72px;padding:28px 32px;background:#fff;border:1px solid var(--line);border-radius:10px}
  .brand-row img{width:100%;height:auto}
  .brand-row p{font-size:16px;color:#3a3a37;margin:0}
  .parts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .part{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 18px 22px}
  .part figure{height:170px;border:0;margin:-4px -6px 14px;background:#f6f5f1}
  .part figure img{padding:10px}
  .part-sw{height:170px;margin:-4px -6px 14px;border-radius:8px;background:#f6f5f1;display:flex;align-items:center;justify-content:center}
  .part-sw span{width:110px;height:110px;border-radius:50%;background:repeating-linear-gradient(45deg,#d9d4c7 0 3px,#e8e4d9 3px 7px);border:2px solid #b9b2a2;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;color:#6b6457}
  .part h4{font-size:17px;font-weight:500;margin:6px 0 6px}
  .part p{font-size:14.5px;color:#4a4a46;line-height:1.5}
  .it-h{font-size:28px;font-weight:500;letter-spacing:-.02em}
  .it-p{max-width:68ch;color:#3a3a37;margin:10px 0 28px}
  .timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;position:relative}
  .t-item{background:#fff;border:1px solid var(--line);border-top:3px solid var(--blue);border-radius:0 0 8px 8px;padding:18px 18px 20px}
  .t-item.fail{border-top-color:#c0694a}
  .t-item.now{border-top-color:#5f8a5a;background:#fbfdf9}
  .t-date{font-family:var(--mono);font-size:11.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
  .t-item h4{font-size:16.5px;font-weight:500;margin:6px 0}
  .t-item p{font-size:14.5px;color:#4a4a46;line-height:1.5}
  .t-tag{display:inline-block;margin-top:12px;font-family:var(--mono);font-size:11px;padding:4px 9px;border-radius:999px;background:#eef1f7;color:var(--blue)}
  .t-item.fail .t-tag{background:#f8ece7;color:#a4512f}
  .t-item.now .t-tag{background:#e9f2e7;color:#3e6b39}
  .r-date{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:6px}
  .r-row li a{color:var(--accent)}
  .dl{display:grid;grid-template-columns:220px 1fr;gap:40px;align-items:center;margin-top:72px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:32px}
  .dl-prev{border:1px solid var(--line);border-radius:4px;overflow:hidden;box-shadow:0 10px 26px rgba(29,53,102,.12);transform:rotate(-1.5deg)}
  .dl h3{font-size:26px;font-weight:500;letter-spacing:-.02em;margin:8px 0 6px}
  .dl p{color:var(--muted);margin-bottom:18px}
  .dl-msg{font-size:14px;color:var(--muted);margin-top:12px}
  .contact{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:72px}
  .c-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:36px;display:flex;flex-direction:column;align-items:flex-start;gap:14px}
  .c-big{font-size:clamp(20px,2.4vw,28px);font-weight:500;letter-spacing:-.02em;color:var(--blue);text-decoration:none;word-break:break-all}
  a.c-big:hover{text-decoration:underline}
  .c-btn{font:500 12.5px var(--mono);letter-spacing:.05em;text-transform:uppercase;background:var(--blue);color:#fff;border:0;border-radius:999px;padding:10px 18px;cursor:pointer;text-decoration:none}
  .c-btn:hover{background:var(--blue-2)}
  .c-note{font-size:14px;color:var(--muted)}
  footer{margin-top:140px;background:var(--blue);color:rgba(255,255,255,.75)}
  footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding-top:36px;padding-bottom:36px;font-size:14px}
  footer .links{display:flex;gap:22px}
  footer a{text-decoration:none}
  footer a:hover{color:#fff}

  #lb{position:fixed;inset:0;background:rgba(15,22,40,.94);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out;padding:40px}
  #lb.open{display:flex}
  #lb img{max-width:100%;max-height:100%;object-fit:contain;border-radius:4px;background:#fff}
  #lb button{position:absolute;top:18px;right:22px;background:none;border:0;color:#fff;font:400 30px/1 var(--sans);cursor:pointer}

  @media (max-width:860px){
    .wrap{padding-left:20px;padding-right:20px}
    nav .wrap{height:auto;flex-direction:column;align-items:flex-start;padding-top:12px;padding-bottom:10px;gap:8px}
    nav .tabs{overflow-x:auto;width:100%;margin-left:-10px}
    nav .tabs a{white-space:nowrap}
    .banner .wrap{padding-top:72px;padding-bottom:60px}
    .banner.home .wrap{padding-top:96px;padding-bottom:80px}
    .summary{grid-template-columns:1fr;gap:36px;padding-top:64px}
    .summary .photo{width:200px;height:200px}
    .qa,.split,.grid2{grid-template-columns:1fr}
    .split.rev > :first-child{order:0}
    .cards,.grid3,.comps{grid-template-columns:1fr 1fr}
    .stats,.stats.two{grid-template-columns:1fr}
    .skills-band{grid-template-columns:1fr}
    .r-row,.contact,.dl,.brand-row{grid-template-columns:1fr}
    .parts,.timeline{grid-template-columns:1fr 1fr}
    .brand-row img{max-width:240px}
    .dl-prev{max-width:200px}
    .r-row{gap:10px}
    .split,.stats,.block{margin-top:56px}
  }
  @media (max-width:520px){.cards{grid-template-columns:1fr}}
</style>
</head>

  <div class="wrap">
    <a class="name" href="#home">Miranda Beitel</a>
    <div class="tabs">
      <a href="#home" data-tab="home">Home</a>

<main id="app"></main>

<footer>

    <div class="links"><a href="#home">Home</a><a href="#projects">Projects</a><a href="#interests">Interests</a><a href="#resume">Resume</a><a href="#contact">Contact</a></div>

<div id="lb" role="dialog" aria-modal="true" aria-label="Image viewer"><button aria-label="Close">×</button><img alt=""></div>

<script>
/* ---------- Content ---------- */
const P = [
{
  id:"sand-stop-pro", title:"Sand Stop Pro", cat:"product", catLabel:"Product design",
  sub:"A drain plug that keeps beach sand out of dinghy hulls",
  thumb:"img/ss-render-cap.jpg", banner:"img/ss-render-cutaway.jpg",
  meta:[["Company","Bowline Design"],["Role","Design Lead"],["Team","4 co-founders"],["Status","V2.1 in testing · 6 units sold"]],
  skills:["Product design","Onshape","Technical drawings","Tolerancing","TPU / ASA / PETG printing","O-ring seal design","Materials testing","ASTM D4355","Dye leak testing","Sales"],
  body:`
  <div class="brand-row">
    <img src="img/bowline-logo.png" alt="Bowline Design logo">
    <p>Sand Stop Pro is the first product from Bowline Design, a four-person startup that grew out of a Design Thinking and Communication class and now incubates at The Garage, Northwestern's student startup incubator. I'm the Design Lead and run sales.</p>
  </div>

  <div class="split">
    <div>
      <h3>Keep the sand out.</h3>
      <p>Sand Stop Pro replaces the stock drain bung on Club 420 and Flying Junior hulls. Water drains, air moves, and a marine geotextile stops beach sand at the transom, so hulls stay dry, light and worth more at resale.</p>
      <p>Sand Stop Pro was field-tested on 6 boats in Northwestern's sailing pavilion monohull fleet, and we sold 6 units to our first paying customer.</p>
    </div>
    <figure style="aspect-ratio:504/378"><img src="img/ss-render-cap.jpg" alt="Render of the Sand Stop Pro cap and screw body"><figcaption>V2.1 render</figcaption></figure>
  </div>

  <div class="stats">
    <div class="stat"><b>95%</b><span>of sand blocked by the final filter design</span></div>
    <div class="stat"><b>90%</b><span>filter strength retained after 500 hours of UV exposure (ASTM D4355)</span></div>
    <div class="stat"><b>6</b><span>units sold to our first paying customer, after field testing on 6 boats</span></div>
  </div>

  <div class="block">
    <span class="label">How it goes together · V2.1</span>
    <div class="parts">
      <div class="part"><figure class="contain"><img src="img/ss-part-screw.jpg" alt="Screw body render"></figure><span class="label">SP-101</span><h4>Screw body</h4><p>Threads into the transom drain hand-tight. ASA or PETG, with a groove for the hull O-ring and a flat seat for the filter.</p></div>
      <div class="part"><figure class="contain"><img src="img/ss-part-ring.jpg" alt="Lock ring render"></figure><span class="label">SP-102</span><h4>Lock ring</h4><p>A 3-lug bayonet ring in ASA, bonded to the screw with flexible marine epoxy. It clamps the filter disc under its lip.</p></div>
      <div class="part"><figure class="contain"><img src="img/ss-part-cap.jpg" alt="Cap render"></figure><span class="label">SP-103</span><h4>Self-clamping cap</h4><p>TPU 95A. Line up the tabs, push, and twist about 57° to a stop. It clamps to the ring, not the hull, and tethers through a Ø4 mm eye.</p></div>
      <div class="part"><div class="part-sw"><span>Ø18.6</span></div><span class="label">SP-104 + O-ring</span><h4>Filter &amp; seal</h4><p>A Ø18.6 mm Mirafi RS580i geotextile disc does the filtering. A 16 × 2 EPDM 70A O-ring seals against the hull.</p></div>
    </div>
  </div>

  <div class="grid3" style="margin-top:12px">
    <figure style="height:300px"><img src="img/ss-render-cutaway.jpg" alt="Cutaway render showing the seal in the hull"><figcaption>Cutaway: installed in the hull</figcaption></figure>
    <figure style="height:300px"><img src="img/ss-render-exploded.jpg" alt="Exploded render" style="object-position:center 60%"><figcaption>Exploded</figcaption></figure>
    <figure style="height:300px"><img src="img/ss-render-macro.jpg" alt="Macro render of cap lettering"><figcaption>Cap detail</figcaption></figure>
  </div>

  <div class="split">
    <div>
      <h3>Engineering drawings</h3>
      <p>I documented V2.1 as a four-sheet drawing set: the assembly (SP-100) with a bill of materials, plus a sheet for each printed part, all toleranced to ±0.2 mm for FDM.</p>
      <ul>
        <li>Thread: right-hand, 3.94 pitch, Ø18.6 major, 45° lead-in</li>
        <li>Lock-ring lugs ramp from 2.90 to 2.15 mm for 0.10 mm of cap preload</li>
        <li>Parts print face-down with no supports; about 2.3 g (screw) and 2.6 g (ring) in ASA</li>
      </ul>
    </div>
    <figure class="contain" style="aspect-ratio:2550/1650"><img src="img/ss-drawing-assembly.jpg" alt="SP-100 assembly drawing" style="padding:8px"><figcaption>SP-100 assembly drawing · click to enlarge</figcaption></figure>
  </div>

  <div class="block">
    <span class="label">V2 design iterations</span>
    <h3 class="it-h">Getting the seal right</h3>
    <p class="it-p">V2 adds a watertight cap and hull seal. Every version gets a dye test: fill the rig with dyed water, flip it upside down for 30 minutes, and see where the dye shows up. Dye at the ring means the hull seal leaked; dye under the cap means the cap seal did.</p>
    <div class="timeline">
      <div class="t-item fail"><span class="t-date">Nov 6</span><h4>Flat-face caps · F0</h4><p>Four caps pressed flat onto the ring at different tolerances, no O-ring. All four leaked at the cap-to-ring face.</p><span class="t-tag">Failed → O-ring cap</span></div>
      <div class="t-item"><span class="t-date">Next</span><h4>First O-ring cap · O1</h4><p>An O-ring face seal in a groove, with the cap underside as a hard stop. It looks watertight, even at about 15% squeeze.</p><span class="t-tag">Promising</span></div>
      <div class="t-item fail"><span class="t-date">Nov 10</span><h4>Straight-collar rings · H1–H3</h4><p>The hull O-ring slipped off the straight collar every time.</p><span class="t-tag">Failed → lipped collar</span></div>
      <div class="t-item now"><span class="t-date">Nov 11 →</span><h4>Lipped-collar rings · H5–H7</h4><p>The collar steps out to a lip, so the O-ring's own stretch pulls it on. Three lip sizes (3%, 4% and 5% stretch) trade grip against ease of fitting. They're being tested in builds B5–B7 against B4, an alternative with the O-ring in a groove on the screw.</p><span class="t-tag">In testing</span></div>
    </div>
  </div>

  <div class="split rev">
    <div>
      <h3>Designing to the numbers</h3>
      <p>Every seal is sized against three targets: 20–30% squeeze, groove fill of 85% or less, and 0–5% stretch. I checked every O-ring in our kit against every cap groove, logged how far each test ring is from the designed size, and used a 0.6 mm printed spacer in place of the compressed filter so seal tests don't use up filter discs.</p>
    </div>
    <div class="stack" style="display:grid;gap:12px">
      <figure class="contain" style="aspect-ratio:1000/532"><img src="img/ss-section.jpg" alt="Cross-section of build B5"><figcaption>Build B5 section</figcaption></figure>
      <figure class="contain" style="aspect-ratio:1000/600"><img src="img/ss-collar-detail.jpg" alt="Lipped collar O-ring detail"><figcaption>Lipped collar detail</figcaption></figure>
    </div>
  </div>

  <div class="split">
    <div>
      <h3>Where it started · V1</h3>
      <p>The first version was a three-part plug, filter and vent cap modelled in Onshape and printed in TPU and PETG. We chose the filter through abrasion, puncture, UV and permeability testing: the selected geotextile retained 90% strength at 500 hours and allowed 68.75% evaporation. Flow matched an unobstructed hull.</p>
    </div>
    <div class="grid2">
      <figure class="contain" style="height:260px"><img src="img/sandstop-assembly.jpg" alt="V1 plug and filter"><figcaption>V1 plug + filter</figcaption></figure>
      <figure class="contain" style="height:260px"><img src="img/sandstop-cap.jpg" alt="V1 vent cap"><figcaption>V1 vent cap</figcaption></figure>
    </div>
  </div>`
},

  const p = P.find(x=>x.id===h);
  let html, tab;
  if(p){ html=projectView(p); tab='projects'; }
  else if(h==='projects'){ html=projectsView(); tab='projects'; }
  else if(h==='interests'){ html=interestsView(); tab='interests'; }
  else if(h==='resume'){ html=resumeView(); tab='resume'; }
  else if(h==='contact'){ html=contactView(); tab='contact'; }
  else { html=homeView(); tab='home'; }
  app.innerHTML = `<div class="view on">${html}</div>`;
  document.querySelectorAll('nav .tabs a').forEach(a=>a.classList.toggle('on',a.dataset.tab===tab));
  document.title = (p ? p.short||p.title.replace('&#8209;','-') : tab==='home' ? 'Home' : tab[0].toUpperCase()+tab.slice(1)) + ' — Miranda Beitel';
  window.scrollTo(0,0);
  bind();
}
function bind(){
  app.querySelectorAll('figure img').forEach(img=>img.parentElement.addEventListener('click',()=>{lbImg.src=img.src;lbImg.alt=img.alt;lb.classList.add('open')}));
  const db = app.querySelector('#dlResume');
  if(db) setupDownload(db, app.querySelector('#dlMsg'));
  const cb = app.querySelector('#copyEmail');
  if(cb) cb.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(EMAIL);cb.textContent='Copied ✓'}catch(e){cb.textContent=EMAIL}setTimeout(()=>cb.textContent='Copy email',2000)});
  const f = app.querySelector('.filters');
  if(f) f.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    f.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    app.querySelectorAll('#cardgrid .card').forEach(c=>c.style.display=(b.dataset.f==='all'||c.dataset.cat===b.dataset.f)?'':'none');
  });
}
function setupDownload(btn,msg){
  btn.hidden=false;
  btn.addEventListener('click',()=>{
    const a=document.createElement('a'); a.href='resume.pdf'; a.download='Miranda_Beitel_Resume.pdf';
    document.body.appendChild(a); a.click(); a.remove();
  });
}
const lb=document.getElementById('lb'), lbImg=lb.querySelector('img');
lb.addEventListener('click',()=>lb.classList.remove('open'));
addEventListener('keydown',e=>{if(e.key==='Escape')lb.classList.remove('open')});
addEventListener('hashchange',render);
render();
</script>
